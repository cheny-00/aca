# Pushing a tag that starts with v (git tag v0.1.0 && git push origin v0.1.0) builds aca for four platforms and attaches
# them to that version's release.
# install.sh downloads the files made here: aca-<platform>.tar.gz (holding only the aca file) and its .sha256.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      # If one platform fails to build, the others still ship
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - name: Build
        run: cargo build --release --locked -p aca --target "$TARGET"
      - name: Package
        run: |
          tar -czf "aca-$TARGET.tar.gz" -C "target/$TARGET/release" aca
          shasum -a 256 "aca-$TARGET.tar.gz" > "aca-$TARGET.tar.gz.sha256"
      - name: Upload
        run: |
          # The four platforms run separately: whichever gets here first creates the release, the later ones only upload files
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "aca-$TARGET.tar.gz" "aca-$TARGET.tar.gz.sha256" --clobber
