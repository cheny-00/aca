id = "aca.gateway"
name = "MCP Gateway"
version = "0.1.0"
api = 1
description = "MCP 注册中心:每个 MCP 只启动一份,所有 agent 通过同一个入口使用"
description_en = "MCP registry: each MCP server runs once and every agent uses it through one entry point."

# On: aca attaches only one MCP to the agent (a relay to the gateway); the MCPs of plugins, capabilities, and the [mcps.*] named
# below all sit behind the gateway.
# Off: each is attached straight to the agent, as before. The gateway is a process started on demand; with nobody connected for
# idle_minutes minutes, it exits by itself.
# To check it: aca plugin gateway status; to change settings: [plugins."aca.gateway"] settings = { servers = ["web"] } in plugins.toml

[settings.servers]
default = []
desc = "通过 gateway 提供给 agent 的 MCP:config.toml 中 [mcps.<名字>] 的名字(scope = \"session\" 的每个会话一份)"
desc_en = "MCP servers handed to agents through the gateway: names of [mcps.<name>] in config.toml (those with scope = \"session\" get one per session)."

[settings.idle_minutes]
default = 10
desc = "没有 agent 连接多久后 gateway 自动退出"
desc_en = "How long the gateway waits with no agent connected before it exits."
