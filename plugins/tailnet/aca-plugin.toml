id = "aca.tailnet"
name = "Tailnet mounts"
version = "0.3.0"
api = 1
description = "查看 tailscale serve 的挂载:复制地址、撤销挂载、挂载本机端口;仅限 tailnet 内"
description_en = "What tailscale serve exposes: copy an address, take one down, serve a port; tailnet only."

# The whole feature is in tailnet.sh (sh + jq, asking tailscale / netstat / tpub); aca has no mount code: a model to follow when
# writing a plugin.
# Exposed to the UI ("Mounts" in the plugin menu, key m) and to agents: listing is free to use; serving a port is agent?,
# given only once you name it (aca plugin allow aca.tailnet add, or ⏎ into it on the plugins page and tick it).
# CLI: aca plugin run aca.tailnet.list

# tailscale isn't listed here: without it the list still opens, saying "tailscale isn't installed"
needs = ["jq"]

[[views]]
id = "mounts"
title = "挂载"
title_en = "Mounts"
rows = true
command = ["sh", "tailnet.sh", "rows"]

[[views.keys]]
key = "enter"
title = "复制地址"
title_en = "Copy the address"
copy = "{url}"

[[views.keys]]
key = "x"
title = "撤销"
title_en = "Take it down"
run = "drop"
args = { target = "{drop}" }
confirm = true

[[views.keys]]
key = "a"
title = "挂载本机端口"
title_en = "Serve a local port"
run = "add"
row = false

[[views.keys]]
key = "p"
title = "开启 / 关闭发布"
title_en = "Publish on / off"
run = "publish"
args = { to = "{publish_to}" }
row = false

[[commands]]
id = "list"
title = "列出 tailnet 挂载"
title_en = "List tailnet mounts"
desc = "List what this machine serves on its tailnet (tailscale serve): each address, the local target it forwards to, and whether that target is listening."
expose = ["cli", "agent"]
command = ["sh", "tailnet.sh", "list"]

[[commands]]
id = "add"
title = "把本机端口挂载到 tailnet"
title_en = "Serve a local port on the tailnet"
desc = "Mount a local port on this machine's tailnet (tailscale serve over HTTPS, same port number on the tailnet, never public) so the user can open a dev server you started from their phone or another machine. Prints the address. port: the local port."
args = { port = "int" }
expose = ["cli", "agent?"]
command = ["sh", "tailnet.sh", "add"]

[[commands]]
id = "drop"
title = "撤销一条挂载"
title_en = "Take down a mount"
args = { target = "string" }
expose = ["cli"]
command = ["sh", "tailnet.sh", "drop"]

[[commands]]
id = "publish"
title = "开启 / 关闭发布(tpub)"
title_en = "Publishing on / off (tpub)"
args = { to = "string" }
expose = ["cli"]
command = ["sh", "tailnet.sh", "publish"]

[[keys]]
key = "m"
run = "mounts"
