id = "aca.tailnet"
name = "Tailnet mounts"
version = "0.3.0"
api = 1
description = "tailscale serve 把本机的什么挂在 tailnet 上:一行一条(目标在不在听),复制地址、撤掉、把本机一个端口挂出去;装了 tpub 还能开关发布。只管 tailnet 里的,不开公网"
description_en = "What tailscale serve exposes from this machine on the tailnet: one row each (with whether its target is listening); copy the address, take it down, or serve a local port; with tpub installed, switch publishing on and off. Tailnet only, never the public internet."

# 整个功能在 tailnet.sh 里(sh + jq,问 tailscale / netstat / tpub),aca 里没有挂载的代码:写插件可以照着它来。
# 露给界面(插件菜单里的「挂载」,键 m)和 agent:列出来随便用;挂端口是 agent?,你点了名才给
# (aca plugin allow aca.tailnet add,或者插件页里 ⏎ 进去勾上)。命令行:aca plugin run aca.tailnet.list

# tailscale 不写在这:没装时列表上照样打开,写着「没装 tailscale」
needs = ["jq"]

[[views]]
id = "mounts"
title = "挂载"
title_en = "Mounts"
rows = true
command = ["sh", "tailnet.sh", "rows"]

[[views.keys]]
key = "enter"
title = "复制地址"
title_en = "Copy the address"
copy = "{url}"

[[views.keys]]
key = "x"
title = "撤掉"
title_en = "Take it down"
run = "drop"
args = { target = "{drop}" }
confirm = true

[[views.keys]]
key = "a"
title = "挂一个本机端口"
title_en = "Serve a local port"
run = "add"
row = false

[[views.keys]]
key = "p"
title = "开关发布"
title_en = "Publish on / off"
run = "publish"
args = { to = "{publish_to}" }
row = false

[[commands]]
id = "list"
title = "列出 tailnet 挂载"
title_en = "List tailnet mounts"
desc = "List what this machine serves on its tailnet (tailscale serve): each address, the local target it forwards to, and whether that target is listening."
expose = ["cli", "agent"]
command = ["sh", "tailnet.sh", "list"]

[[commands]]
id = "add"
title = "把本机端口挂到 tailnet"
title_en = "Serve a local port on the tailnet"
desc = "Mount a local port on this machine's tailnet (tailscale serve over HTTPS, same port number on the tailnet, never public) so the user can open a dev server you started from their phone or another machine. Prints the address. port: the local port."
args = { port = "int" }
expose = ["cli", "agent?"]
command = ["sh", "tailnet.sh", "add"]

[[commands]]
id = "drop"
title = "撤掉一条挂载"
title_en = "Take down a mount"
args = { target = "string" }
expose = ["cli"]
command = ["sh", "tailnet.sh", "drop"]

[[commands]]
id = "publish"
title = "开 / 关发布(tpub)"
title_en = "Publishing on / off (tpub)"
args = { to = "string" }
expose = ["cli"]
command = ["sh", "tailnet.sh", "publish"]

[[keys]]
key = "m"
run = "mounts"
