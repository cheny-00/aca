id = "aca.bark"
name = "Bark"
version = "0.1.0"
api = 1
needs = ["curl", "jq"]
description = "会话完成一轮、等待回应或出错时推送到手机(Bark);有人正在查看该会话时不推送"
description_en = "Pushes to your phone (Bark) when a session finishes, waits or fails; not while someone is watching it."

# 地址在 plugins.toml 里填:[plugins."aca.bark"] settings = { url = "https://api.day.app/<你的 key>" }

[settings.url]
default = ""
secret = true
desc = "Bark 的推送地址:https://api.day.app/<你的 key>(也可以用自建的 Bark server)。留空则不推送"
desc_en = "Bark push URL: https://api.day.app/<your key> (a self-hosted Bark server works too). Empty: push nothing."

[settings.workers]
default = false
desc = "派出的 worker(有 parent 的会话)也推送。默认不推送:worker 完成后会通知派出它的会话"
desc_en = "Also push for dispatched workers (sessions with a parent). Off by default: a finished worker reports to the session that dispatched it."

[settings.group]
default = "aca"
desc = "推送在手机上归入的分组"
desc_en = "The group the notifications are filed under on the phone."

[[events]]
on = "turn.done"
command = ["sh", "push.sh"]

[[events]]
on = "agent.waiting"
command = ["sh", "push.sh"]

[[events]]
on = "turn.failed"
command = ["sh", "push.sh"]

[[commands]]
id = "test"
title = "发送一条测试推送"
title_en = "Push a test one"
desc = "Push a test notification to check the Bark URL."
# 诊断用的,不进 : 菜单(那里是对着高亮那一行做事的);aca plugin run aca.bark.test
expose = ["cli"]
command = ["sh", "push.sh", "test"]
