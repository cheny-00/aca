id = "example.git-glance"
name = "Git Glance"
version = "0.1.0"
api = 1
description = "每轮跑完,在会话行上挂一段改动统计;弹窗里看 diff"

# 一轮跑完:数一下工作区的改动,挂到会话行上(列表里的 [git …])
[[events]]
on = "turn.done"
command = ["sh", "stat.sh"]

[[commands]]
id = "refresh"
title = "刷新改动统计"
contexts = ["session"]
command = ["sh", "stat.sh"]

[[panes]]
id = "diff"
title = "改动"
placement = "popup"
width = "90%"
height = "90%"
command = ["sh", "diff.sh"]
