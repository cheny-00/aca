id = "example.git-glance"
name = "Git Glance"
version = "0.1.0"
api = 1
description = "每轮结束后,在会话行上显示改动统计;在弹窗中查看 diff"
description_en = "After each turn, put a summary of the changes on the session's row; see the diff in a popup."

# 一轮跑完:数一下工作区的改动,挂到会话行上(列表里的 [git …])
[[events]]
on = "turn.done"
command = ["sh", "stat.sh"]

[[commands]]
id = "refresh"
title = "刷新改动统计"
title_en = "Refresh the change summary"
contexts = ["session"]
command = ["sh", "stat.sh"]

[[panes]]
id = "diff"
title = "改动"
title_en = "Changes"
placement = "popup"
width = "90%"
height = "90%"
command = ["sh", "diff.sh"]
