id = "aca.discord"
name = "Discord"
version = "0.1.0"
api = 1
needs = ["curl", "jq"]
description = "会话完成一轮、等待回应或出错时发送到 Discord 频道(webhook);有人正在查看该会话时不发送。只发送,不接收"
description_en = "Posts to a Discord channel (webhook) when a session finishes, waits or fails; not while someone is watching it. Outgoing only."

# The address goes in plugins.toml: [plugins."aca.discord"] settings = { url = "https://discord.com/api/webhooks/…" }
# or aca plugin setting aca.discord url <url>

[settings.url]
default = ""
secret = true
desc = "频道的 webhook 地址(频道设置 → 整合 → Webhooks → 复制网址)。留空则不发送"
desc_en = "The channel's webhook URL (channel settings → Integrations → Webhooks → Copy Webhook URL). Empty: post nothing."

[settings.mention]
default = ""
desc = "等待回应时 @ 谁:你的 Discord 用户 id(一串数字)。留空则不 @ 任何人"
desc_en = "Who to @ when a session waits for you: your Discord user id (a string of digits). Empty: @ nobody."

[settings.workers]
default = false
desc = "派出的 worker(有 parent 的会话)也发送。默认不发送:worker 完成后会通知派出它的会话"
desc_en = "Also post for dispatched workers (sessions with a parent). Off by default: a finished worker reports to the session that dispatched it."

[settings.username]
default = "aca"
desc = "消息在频道中显示的发送者名称"
desc_en = "The name the messages are posted under in the channel."

[[events]]
on = "turn.done"
command = ["sh", "post.sh"]

[[events]]
on = "agent.waiting"
command = ["sh", "post.sh"]

[[events]]
on = "turn.failed"
command = ["sh", "post.sh"]

[[commands]]
id = "test"
title = "发送一条测试消息"
title_en = "Post a test one"
desc = "Post a test message to check the Discord webhook URL."
# For diagnosis, kept out of the : menu (that one acts on the highlighted row); aca plugin run aca.discord.test
expose = ["cli"]
command = ["sh", "post.sh", "test"]
