id = "aca.core"
name = "aca core tools"
version = "0.1.0"
api = 1
description = "把 aca 的核心能力作为工具提供给 agent:查看会话、派出 worker、传话、等待、代为回答、中止、过会儿叫醒自己。默认不安装"
description_en = "aca's core abilities as agent tools: list sessions, dispatch workers, message, wait, answer, interrupt, wake yourself later. Not installed by default."

# Each tool is one aca command (core.sh), and the calling session is ACA_SESSION_ID: new workers go under it, and the ones it
# answers for or interrupts can only be those it sent out itself (that's how aca answer / interrupt check it themselves).
# To offer it to only some accounts: [plugins."aca.core"] agents = ["claude:work"] in plugins.toml

# Codex also gets a skill (wakeup): for work that takes several minutes, rather than sit waiting in this turn, it has
# `aca msg --in` wake it later and comes back to check. Given only the tool, it doesn't reach for it on its own (verified 2026-10-29).
# Claude has its own ScheduleWakeup, so it doesn't get this
[agent]
for = ["codex"]
dir = "agent"

[[commands]]
id = "sessions"
title = "查看 aca 的会话"
title_en = "List aca's sessions"
desc = "List aca sessions (id, title, state, tool, parent, dir) as JSON; with id, show one session including its last reply."
args = { id = "string?" }
expose = ["agent"]
command = ["sh", "core.sh", "sessions"]

[[commands]]
id = "dispatch"
title = "派出 worker"
title_en = "Dispatch a worker"
desc = "Start a worker agent session as your child and send it the task. tool: claude / codex / a tool name from aca (tool:account works). branch: start it in its own git worktree on that branch. dir defaults to your own directory. Returns the new session id; use wait to know when it's done and sessions to read its reply."
args = { tool = "string", task = "string", dir = "path?", branch = "string?", title = "string?" }
expose = ["agent"]
command = ["sh", "core.sh", "dispatch"]

[[commands]]
id = "message"
title = "给其他会话传话"
title_en = "Pass a message to another session"
desc = "Pass a message to another session's inbox (to: a session id, or parent for the one that dispatched you). It's delivered when that agent is free; nothing is typed into its input box."
args = { to = "string", text = "string" }
expose = ["agent"]
command = ["sh", "core.sh", "message"]

[[commands]]
id = "wait"
title = "等待 worker"
title_en = "Wait for workers"
desc = "Wait up to 240 s for sessions (ids separated by spaces) to finish a turn, wait for confirmation, fail or exit. Prints what happened and the exit code: 0 finished a turn, 2 waiting for confirmation, 3 failed, 4 exited, 124 still running (call again)."
args = { ids = "string", any = "bool?" }
expose = ["agent"]
command = ["sh", "core.sh", "wait"]

[[commands]]
id = "answer"
title = "代 worker 回答"
title_en = "Answer for a worker"
desc = "Without answer: show what a session you dispatched is asking. With answer: a choice number, or yes / no for a permission prompt."
args = { id = "string", answer = "string?" }
expose = ["agent"]
command = ["sh", "core.sh", "answer"]

[[commands]]
id = "wakeup"
title = "过会儿叫醒自己"
title_en = "Wake yourself later"
desc = "Have aca hand you text as a new message after a delay (after: like 90s, 10m, 1h30m; 7 days at most). It comes even after this turn ends, so end the turn instead of polling or sleeping while something slow runs, and check back then."
args = { after = "string", text = "string" }
expose = ["agent"]
command = ["sh", "core.sh", "wakeup"]

[[commands]]
id = "interrupt"
title = "中止 worker 当前这一轮"
title_en = "Interrupt a worker's turn"
desc = "Stop the current turn of a session you dispatched (it went the wrong way). It stays idle; message it or dispatch again."
args = { id = "string" }
expose = ["agent"]
command = ["sh", "core.sh", "interrupt"]
