id = "aca.copy"
name = "Copy"
version = "0.1.0"
api = 1
needs = ["fzf"]
description = "按一个键,从最后一条回复中选出命令或代码块并复制"
description_en = "One key picks a command or code block from the last reply and copies it."

# The whole feature is in copy.sh; aca has no code for it. It reads the original text of the reply, not the screen (code blocks
# on screen carry no markers, and long ones are wrapped): a block fenced with ``` is taken whole; inline `…` only when it has
# a space in it, by default. If only one is found it's copied right away; only with several does a picker pop up (number keys).
#
# Press Ctrl+Alt+Y inside a session (also while scrolled up; y = yank, the same letter as y in the : menu). It's a hotkey: aca
# binds it in tmux and intercepts it only in aca's sessions; it's there once installed, and stopping or deleting the plugin
# unbinds it, with no change to tmux.conf.
#   Another key: aca plugin hotkey aca.copy pick M-y        No key: aca plugin hotkey aca.copy pick --none
# To use a key of the terminal itself (tmux doesn't receive cmd): have the terminal send this key in its place. kitty.conf:
#   map cmd+shift+c send_text all \x1b\x19

[settings.inline]
default = "spaced"
desc = "列出哪些行内的 `…`:spaced 只列含空格的(通常是一条命令)/ all 全部列出 / none 只列代码块"
desc_en = "Which inline `…` spans to offer: spaced = only those with a space in them (most likely a command) / all / none = code blocks only."

[settings.lines]
default = true
desc = "shell 代码块中有多条命令时,也逐条单独列出(可以只复制其中一条)"
desc_en = "When a shell code block holds several commands, also list each one on its own (so you can copy just one)."

[settings.copy]
default = ""
desc = "用于复制的命令(内容从标准输入传入)。留空 = tmux 缓冲区 + 通过 OSC 52 发给外层终端 + 本机的 pbcopy / wl-copy / xclip"
desc_en = "The command that copies (it gets the text on standard input). Empty = the tmux buffer + OSC 52 to the outer terminal + pbcopy / wl-copy / xclip on this machine."

[[panes]]
id = "pick"
title = "复制命令"
title_en = "Copy a command"
contexts = ["session"]
placement = "popup"
width = "80%"
height = "60%"
input = "reply"
command = ["sh", "copy.sh", "pick"]

[[commands]]
id = "list"
title = "列出回复中的命令"
title_en = "List the commands in the reply"
desc = "List the commands and code blocks found in this session's last reply, one per line."
contexts = ["session"]
input = "reply"
command = ["sh", "copy.sh", "list"]

# Pressed directly inside a session
[[hotkeys]]
key = "C-M-y"
run = "pick"

# In the : menu of the UI
[[keys]]
key = "y"
run = "pick"
