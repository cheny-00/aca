id = "aca.remote"
name = "Remote tasks"
version = "0.3.1"
api = 1
description = "把耗时长的任务派到其他机器上后台运行(ssh),结果发回派出它的会话"
description_en = "Runs long tasks in the background on another machine (ssh); the result comes back to the session that sent it."
needs = ["jq", "curl", "ssh"]

# The whole feature is remote.sh (sh + jq + curl + ssh); aca has no code for remote tasks, it only uses the plugin interface.
# Callbacks land first on a server that is always online (jobhook; for how to install it see https://github.com/cheny-00/jobhook);
# its address and token are the two settings below.

[settings.url]
default = ""
desc = "server 的地址(https://…):远端回调和获取结果都使用它"
desc_en = "The server's address (https://…): the remote side calls back to it and results are fetched from it."

[settings.token]
default = ""
secret = true
desc = "server 的管理口令,与它的 JOBHOOK_TOKEN 相同"
desc_en = "The server's admin token, the same as its JOBHOOK_TOKEN."

[[commands]]
id = "run"
title = "派到其他机器上运行"
title_en = "Run on another machine"
desc = "Run a long command in the background on another machine (over ssh) and return at once. When it ends, its exit code and the last lines of its log come back to you as a message, so don't wait, poll or ssh in to watch. host: an ssh host. command: the shell command. note: what to call the task in the message. within: time limit like 90m / 6h / 2d (default 24h, 0 = none)."
contexts = ["session"]
args = { host = "string", command = "string", note = "string?", within = "string?" }
expose = ["menu", "cli", "agent"]
command = ["sh", "remote.sh", "run"]

[[commands]]
id = "new"
title = "仅登记(自行回调)"
title_en = "Register only (call back yourself)"
desc = "Register a task without starting it: prints an id and a curl line to run when your own task ends."
args = { note = "string?", host = "string?", within = "string?" }
expose = ["cli"]
command = ["sh", "remote.sh", "new"]

[[commands]]
id = "list"
title = "列出远端任务"
title_en = "List remote tasks"
desc = "List remote tasks: the ones still running and the ones that settled recently, with how they ended."
expose = ["cli", "agent"]
command = ["sh", "remote.sh", "list"]

[[commands]]
id = "rm"
title = "撤销一个远端任务"
title_en = "Drop a remote task"
args = { id = "string" }
expose = ["cli"]
command = ["sh", "remote.sh", "rm"]

[[commands]]
id = "collect"
title = "立即从 server 获取一次"
title_en = "Fetch from the server now"
expose = ["cli"]
command = ["sh", "remote.sh", "collect"]

[[commands]]
id = "check"
title = "测试 server(能否连接、口令是否正确)"
title_en = "Test the server (reachable, token right)"
# For diagnosis, kept out of the : menu (that one acts on the highlighted row); aca plugin run aca.remote.check
expose = ["cli"]
command = ["sh", "remote.sh", "check"]

# Fetches every 5 minutes: turned on when a task is sent, and collect turns it off itself once all are settled — on days with
# no tasks sent, nothing runs
[[timers]]
run = "collect"
every = "5m"
manual = true

# One row each: waiting (● for how long), lost (? no callback by the deadline), finished (✓ / ✕ exit code, sent to the session
# or not); below, the session of the highlighted one and the last lines of its result
[[views]]
id = "tasks"
title = "远端任务"
title_en = "Remote tasks"
rows = true
command = ["sh", "remote.sh", "rows"]

[[views.keys]]
key = "enter"
title = "复制查看日志的命令"
title_en = "Copy the command that shows the log"
copy = "{log_cmd}"

[[views.keys]]
key = "x"
title = "撤销(远端的任务不会停止,只是不再等待它)"
title_en = "Drop it (the remote task keeps running; it's just no longer waited for)"
run = "rm"
args = { id = "{id}" }
confirm = true

[[views.keys]]
key = "r"
title = "立即获取"
title_en = "Fetch now"
run = "collect"
row = false

[[keys]]
key = "r"
run = "run"

[[keys]]
key = "t"
run = "tasks"
