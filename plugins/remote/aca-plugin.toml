id = "aca.remote"
name = "Remote tasks"
version = "0.3.0"
api = 1
description = "把长任务派到别的机器上后台跑(ssh),结束时结果作为一条消息发回派它的会话。你在界面 : 菜单里派,agent 用工具派"
needs = ["jq", "curl", "ssh"]

# 整个功能就是 remote.sh(sh + jq + curl + ssh),aca 里没有远端任务的代码,用的只是插件接口。
# 回调先落在一台一直在线的 server 上(装法见仓库的 hub/README.md),地址和口令是下面两个设置。

[settings.url]
default = ""
desc = "server 的地址(https://…):远端回调、去取结果都用它"

[settings.token]
default = ""
secret = true
desc = "server 的管理口令,和它的 JOBHOOK_TOKEN 一样"

[[commands]]
id = "run"
title = "派到别的机器上跑"
desc = "Run a long command in the background on another machine (over ssh) and return at once. When it ends, its exit code and the last lines of its log come back to you as a message, so don't wait, poll or ssh in to watch. host: an ssh host. command: the shell command. note: what to call the task in the message. within: time limit like 90m / 6h / 2d (default 24h, 0 = none)."
contexts = ["session"]
args = { host = "string", command = "string", note = "string?", within = "string?" }
expose = ["menu", "cli", "agent"]
command = ["sh", "remote.sh", "run"]

[[commands]]
id = "new"
title = "只登记(自己接回调)"
desc = "Register a task without starting it: prints an id and a curl line to run when your own task ends."
args = { note = "string?", host = "string?", within = "string?" }
expose = ["cli"]
command = ["sh", "remote.sh", "new"]

[[commands]]
id = "list"
title = "列出远端任务"
desc = "List remote tasks: the ones still running and the ones that settled recently, with how they ended."
expose = ["cli", "agent"]
command = ["sh", "remote.sh", "list"]

[[commands]]
id = "rm"
title = "撤掉一个远端任务"
args = { id = "string" }
expose = ["cli"]
command = ["sh", "remote.sh", "rm"]

[[commands]]
id = "collect"
title = "现在去 server 取一次"
expose = ["cli"]
command = ["sh", "remote.sh", "collect"]

[[commands]]
id = "check"
title = "测一下 server(连不连得上、口令对不对)"
expose = ["menu", "cli"]
command = ["sh", "remote.sh", "check"]

# 每 5 分钟去取一次:派任务时开上,都了结了 collect 自己关掉 —— 没派任务的日子里什么都不跑
[[timers]]
run = "collect"
every = "5m"
manual = true

# 一行一个:在等(● 已经多久)、失联(? 过了时限没回调)、结束(✓ / ✕ 退出码,发给会话了没有);下面是高亮那个的会话和结果最后几行
[[views]]
id = "tasks"
title = "远端任务"
rows = true
command = ["sh", "remote.sh", "rows"]

[[views.keys]]
key = "enter"
title = "复制看日志的命令"
copy = "{log_cmd}"

[[views.keys]]
key = "x"
title = "撤掉(远端的任务不会停,只是不再等它)"
run = "rm"
args = { id = "{id}" }
confirm = true

[[views.keys]]
key = "r"
title = "现在去取"
run = "collect"
row = false

[[keys]]
key = "r"
run = "run"

[[keys]]
key = "t"
run = "tasks"
