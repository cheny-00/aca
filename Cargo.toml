[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"

# Dependency versions are written only here, once; each crate says `xxx.workspace = true`
[workspace.dependencies]
aca-core = { path = "crates/aca-core" }
aca-tui = { path = "crates/aca-tui" }
libc = "0.2"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
toml = "1.1.6"

[workspace.lints.clippy]
# Long lines and functions with many parameters are deliberate in this project; everything else follows clippy's defaults
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "thin"
# Strip only the debug info and keep function names: stack traces in crash reports (~/Library/Logs/DiagnosticReports/aca-*.ips)
# and in exit.log then show which function it happened in
strip = "debuginfo"
